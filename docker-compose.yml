# Staging and production run this file alone. Local development adds
# docker-compose.dev.yml, which mounts the code from the host, through
# COMPOSE_FILE in the root .env. Other differences between environments live
# only in the root .env and laravel/.env files.
#
# On servers, the app and nginx images contain one commit's code, PHP
# dependencies, and built assets (see the Dockerfile). Nothing on the host
# changes what a running container serves; a deploy builds new images while
# the old containers keep running, then replaces them.

# The PHP containers shared by app, queue, and scheduler: the same image,
# user, and settings, so all three run the same Laravel application
x-php: &php
  build:
    context: .
    target: app
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  # Tagged with the commit by deploys (IMAGE_TAG), so the previous release's
  # image stays available for a rollback
  image: ${APP_NAME}-app:${IMAGE_TAG:-latest}
  restart: unless-stopped
  working_dir: /var/www/laravel
  user: "${UID:-1000}:${GID:-1000}"
  environment:
    # The container user has no home directory; this gives Tinker and
    # Composer somewhere writable for their settings and caches
    HOME: /tmp
    # The Stripe SDK turns notices from Stripe into PHP warnings, which
    # Laravel throws as exceptions, failing API calls that succeeded. The SDK
    # reads this from the process environment, not laravel/.env.
    STRIPE_SUPPRESS_NOTICES: "true"
  volumes:
    # The settings and secrets, read when each container starts. Never in
    # an image. Mounted read-only, and required: without the file, Docker
    # would create an empty directory in its place.
    - type: bind
      source: ./laravel/.env
      target: /var/www/laravel/.env
      read_only: true
      bind:
        create_host_path: false
    # Logs, sessions, and stored files, kept across releases and shared by
    # the three containers
    - storage:/var/www/laravel/storage
  # Waits for the database to accept connections, so migrations can run as
  # soon as a new server's database container starts
  depends_on:
    db:
      condition: service_healthy
  networks:
    - app-network

services:
  app:
    <<: *php
    container_name: ${APP_NAME}-app
    # PHP-FPM accepts connections. Deploys wait for this before finishing.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  # Runs queued jobs, such as processing payment gateway webhooks. Exits
  # after an hour, and Docker starts it again. Each deploy replaces it, so it
  # always runs the deployed code.
  queue:
    <<: *php
    container_name: ${APP_NAME}-queue
    command: php artisan queue:work --sleep=3 --max-time=3600
    # When a deploy replaces it, the worker finishes its current job before
    # exiting
    stop_grace_period: 60s

  # Runs the tasks scheduled in laravel/routes/console.php, such as the
  # nightly payment sync
  scheduler:
    <<: *php
    container_name: ${APP_NAME}-scheduler
    command: php artisan schedule:work

  # Serves the public files, including the built assets, and passes PHP
  # requests to app
  nginx:
    build:
      context: .
      target: nginx
    image: ${APP_NAME}-nginx:${IMAGE_TAG:-latest}
    container_name: ${APP_NAME}-nginx
    restart: unless-stopped
    # Published ports are bound to localhost only. Docker's port publishing
    # bypasses host firewalls such as ufw, so on a server anything public
    # must go through the reverse proxy instead.
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    # The site answers through PHP (Laravel's /up health route)
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1/up"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - app-network

  db:
    image: postgis/postgis:17-3.5
    container_name: ${APP_NAME}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=\"$$POSTGRES_USER\" --dbname=\"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - app-network

  # Servers only (COMPOSE_PROFILES=server in the root .env).
  # Terminates HTTPS for the domains in deploy/caddy/$CADDY_SITE.Caddyfile,
  # and shows deploy/caddy/maintenance.html while the site is unavailable.
  # The config directory is mounted rather than the file, so changes pulled
  # by a deploy are visible to `caddy reload`.
  caddy:
    image: caddy:2
    profiles: ["server"]
    container_name: ${APP_NAME}-caddy
    restart: unless-stopped
    command: caddy run --config /etc/caddy/${CADDY_SITE:-staging}.Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      # The maintenance flag (deploy/maintenance/on), written by deploys on
      # the host and only read by Caddy
      - ./deploy/maintenance:/srv/maintenance:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx
    networks:
      - app-network

  # Servers only. Receives GitHub push webhooks and writes a trigger file
  # that starts the deploy on the host. It has no Docker access.
  webhook:
    build:
      context: ./deploy/webhook
    profiles: ["server"]
    container_name: ${APP_NAME}-webhook
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      DEPLOY_BRANCH: ${DEPLOY_BRANCH:-}
    volumes:
      - ./deploy/trigger:/trigger
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  storage:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
