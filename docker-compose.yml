# Used unchanged in every environment (local development, staging, and
# production). Differences between environments live only in the root .env
# and laravel/.env files.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME}-app
    restart: unless-stopped
    working_dir: /var/www/laravel
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: ${APP_NAME}-nginx
    restart: unless-stopped
    # Published ports are bound to localhost only. Docker's port publishing
    # bypasses host firewalls such as ufw, so on a server anything public
    # must go through the reverse proxy instead.
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
    networks:
      - app-network

  db:
    image: postgis/postgis:17-3.5
    container_name: ${APP_NAME}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - app-network

  # Builds frontend assets, so no environment needs Node installed.
  # Not started by `docker compose up`; run it on demand:
  #   docker compose run --rm node npm ci
  #   docker compose run --rm node npm run build
  node:
    image: node:24-slim
    profiles: ["tools"]
    working_dir: /var/www/laravel
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # The container user has no writable home directory
      npm_config_cache: /tmp/.npm
    volumes:
      - ./:/var/www

networks:
  app-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
