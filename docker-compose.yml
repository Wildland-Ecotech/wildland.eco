# Used unchanged in every environment (local development, staging, and
# production). Differences between environments live only in the root .env
# and laravel/.env files.

# The PHP container shared by app, queue, and scheduler: the same image, code,
# and user, so all three run the same Laravel application
x-php: &php
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  working_dir: /var/www/laravel
  user: "${UID:-1000}:${GID:-1000}"
  environment:
    # The container user has no home directory; this gives Tinker and
    # Composer somewhere writable for their settings and caches
    HOME: /tmp
    # The Stripe SDK turns notices from Stripe into PHP warnings, which
    # Laravel throws as exceptions, failing API calls that succeeded. The SDK
    # reads this from the process environment, not laravel/.env.
    STRIPE_SUPPRESS_NOTICES: "true"
  volumes:
    - ./:/var/www
  networks:
    - app-network

services:
  app:
    <<: *php
    container_name: ${APP_NAME}-app

  # Runs queued jobs, such as processing payment gateway webhooks. Exits
  # after an hour, or when a deploy runs `php artisan queue:restart`, and
  # Docker starts it again with the current code and configuration.
  queue:
    <<: *php
    container_name: ${APP_NAME}-queue
    command: php artisan queue:work --sleep=3 --max-time=3600
    depends_on:
      - db

  # Runs the tasks scheduled in laravel/routes/console.php, such as the
  # nightly payment sync. Each minute's run is a new process, so it always
  # uses the current code.
  scheduler:
    <<: *php
    container_name: ${APP_NAME}-scheduler
    command: php artisan schedule:work
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: ${APP_NAME}-nginx
    restart: unless-stopped
    # Published ports are bound to localhost only. Docker's port publishing
    # bypasses host firewalls such as ufw, so on a server anything public
    # must go through the reverse proxy instead.
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
    networks:
      - app-network

  db:
    image: postgis/postgis:17-3.5
    container_name: ${APP_NAME}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - app-network

  # Local development only. A disposable database for the test suite, from the
  # same image as db, so tests run on the same code paths as production and
  # never touch the development database. Its data lives in memory and is
  # discarded when the container stops. Start it with:
  #   docker compose --profile testing up -d db-test
  db-test:
    image: postgis/postgis:17-3.5
    profiles: ["testing"]
    container_name: ${APP_NAME}-db-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: testing
      POSTGRES_USER: testing
      POSTGRES_PASSWORD: testing
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - app-network

  # Builds frontend assets, so no environment needs Node installed.
  # Not started by `docker compose up`; run it on demand:
  #   docker compose run --rm node npm ci
  #   docker compose run --rm node npm run build
  node:
    image: node:24-slim
    profiles: ["tools"]
    working_dir: /var/www/laravel
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # The container user has no writable home directory
      npm_config_cache: /tmp/.npm
    volumes:
      - ./:/var/www

  # Local development only, never on servers (deploy/deploy.sh refuses to
  # deploy with this profile). Forwards Stripe test mode events to the
  # webhook endpoint, using STRIPE_SECRET from laravel/.env. Start it when
  # testing payments, and copy the signing secret it prints (whsec_) into
  # STRIPE_WEBHOOK_SECRET:
  #   docker compose --profile stripe up -d stripe
  #   docker compose logs stripe
  stripe:
    image: stripe/stripe-cli:v1.55.1
    profiles: ["stripe"]
    container_name: ${APP_NAME}-stripe
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - path: laravel/.env
        required: false
    environment:
      XDG_CONFIG_HOME: /tmp/.config
      STRIPE_DEVICE_NAME: ${APP_NAME}-local
      # The events the payment sync handles. Keep in step with the events
      # the staging and production webhook endpoints send (see
      # docs/07-deployment.md#stripe)
      STRIPE_EVENTS: >-
        checkout.session.completed,checkout.session.expired,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,invoice.paid,invoice.payment_failed,payment_intent.succeeded,payment_intent.payment_failed,charge.refunded,customer.subscription.created,customer.subscription.updated,customer.subscription.deleted,customer.updated
    # Refuses to start with anything but a test mode key
    entrypoint:
      - /bin/sh
      - -c
      - |
        case "$$STRIPE_SECRET" in
          sk_test_*|rk_test_*) ;;
          *) echo "STRIPE_SECRET in laravel/.env must be a test mode key." >&2; exit 1 ;;
        esac
        STRIPE_API_KEY="$$STRIPE_SECRET" exec stripe listen \
          --forward-to http://nginx/webhooks/stripe \
          --events-from @self \
          --events "$$STRIPE_EVENTS"
    depends_on:
      - nginx
    networks:
      - app-network

  # Servers only (COMPOSE_PROFILES=server in the root .env).
  # Terminates HTTPS for the domains in deploy/caddy/$CADDY_SITE.Caddyfile.
  # The config directory is mounted rather than the file, so changes pulled
  # by a deploy are visible to `caddy reload`.
  caddy:
    image: caddy:2
    profiles: ["server"]
    container_name: ${APP_NAME}-caddy
    restart: unless-stopped
    command: caddy run --config /etc/caddy/${CADDY_SITE:-staging}.Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx
    networks:
      - app-network

  # Servers only. Receives GitHub push webhooks and writes a trigger file
  # that starts the deploy on the host. It has no Docker access.
  webhook:
    build:
      context: ./deploy/webhook
    profiles: ["server"]
    container_name: ${APP_NAME}-webhook
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      DEPLOY_BRANCH: ${DEPLOY_BRANCH:-}
    volumes:
      - ./deploy/trigger:/trigger
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
