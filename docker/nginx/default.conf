server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    # On servers, Caddy writes the access logs, with the visitor's own address
    # and a 90-day limit (deploy/caddy/site.caddy). nginx only sees Caddy's
    # address, so its own access log would repeat each request without the
    # visitor's. Errors are still logged.
    access_log off;

    root /var/www/laravel/public;
    index index.php;

    # Look up the app container through Docker's DNS every few seconds,
    # rather than once when nginx starts, so replacing or restarting app
    # (which changes its address) never leaves nginx sending requests to the
    # old one
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $php_upstream app:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
